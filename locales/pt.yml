pt:
  # The English personal story is the current home page. Keep the legacy
  # explainer page copy separate from it.
  intro_text1: "O meu nome é Diogo, sou programador de front-end e sou de Ermesinde."
  intro_text2: "Formei-me em Engenharia Industrial na FEUP. Sou fã de hip-hop e, nos tempos livres, gosto de jogar e de perceber como as coisas funcionam."
  intro_text3: "O meu percurso levou-me do desenvolvimento de software à engenharia aplicacional, suporte de produção, DevOps e fiabilidade."
  intro_text4: "Na Fater, usei dados de produção para acompanhar o desempenho das linhas e planear manutenção. Foi aí que comecei a reparar nos pequenos sinais que podem evitar problemas maiores."
  intro_text5: "Na Made In Alpha, Proflands e Critical TechWorks, aprendi a construir com equipas distribuídas, designers e pessoas de produto, acompanhando funcionalidades desde a ideia até à implementação e aos testes."
  intro_text6: "Na universidade, comecei o “Entregas E Agora?”, um serviço de entregas ao domicílio. Entre 2019 e 2025, fui membro da direção da The Agency Clan, uma equipa e associação de esports."
  intro_text7: "Ocasionalmente, aconselho a Rucodel, uma pequena empresa de produção, sobre melhoria de processos e ideias práticas de software com apoio de IA."
  intro_text8: "Podes encontrar-me no <a href=https://github.com/thediogoribeiro>GitHub</a>, contactar-me pelo <a href=https://www.linkedin.com/in/jos%C3%A9-diogo-ribeiro-4390a86b>LinkedIn</a> ou acompanhar-me no <a href=https://twitter.com/ShinOBarbaro>Twitter</a>."
