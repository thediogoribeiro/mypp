en:
  # intro
  intro_title1: "Hi 🙋‍♂️,"
  intro_text1: "I'm Diogo, an engineer in Porto working across software, application operations and reliability."
  intro_title2: "About me 💁‍♂️"
  intro_text2: "I studied Industrial Engineering at FEUP. I’m a big hip-hop fan and during my free time I enjoy gaming and learning how things work."
  intro_title3: "Engineering 🖥"
  intro_text3: "My work has grown from software development into application engineering, production support, DevOps and reliability."
  intro_text4: "At Fater, I used production data to follow line performance and plan maintenance. That early experience taught me to notice the small signals that can prevent bigger problems."
  intro_text5: "At Made In Alpha, Proflands and Critical TechWorks, I learned to build with distributed teams, designers and product people, carrying features from ideas through implementation and testing."
  intro_title6: "Outside the day job 🤹‍♂️"
  intro_text6: "At university I started “Entregas E Agora?”, a home-delivery service. From 2019 to 2025 I was a board member of The Agency Clan, an esports team and association."
  intro_text7: "I occasionally advise Rucodel, a small manufacturing business, on process improvement and practical AI-assisted software ideas."
  intro_title8: "Say hello 📱"
  intro_text8: "You can find me on <a href=https://github.com/thediogoribeiro>GitHub</a>, connect on <a href=https://www.linkedin.com/in/jos%C3%A9-diogo-ribeiro-4390a86b>LinkedIn</a>, or follow <a href=https://twitter.com/ShinOBarbaro>Twitter</a>."

  # intro-ex
  intro_text9: "O meu nome é Diogo, sou programador de front-end e sou de Ermesinde. Paralelamente à programação também dou explicações de matemática."
  intro_text10: "Estou disponível para dar explicações na area metropolitana do Porto e através de internet (skype, hangouts, etc). Qualquer dúvida não hesitem em contactar-me via <a href=mailto: diogo@iamdiogoribeiro.com>email</a>."
  intro_text11: "Sou formado em Engenharia Industrial na FEUP com uma média de ingresso de 17.9 valores e classificação de 19.6 no exame nacional de matemática."
  intro_text12: "Enquanto explicador ajudei os alunos a subir a média e a prepararem-se para os exames nacionais. Desenvolvi a actividade durante faculdade mas interrompi para exercer Engenharia. Recentemente decidi fazer uma mudança no meu percurso profissional e neste momento dedico o meu tempo à tecnologia e à sua aplicação no quotidiano."
  intro_text13: "Consegues acompanhar os meus pensamentos no <a href=https://twitter.com/ShinOBarbaro>Twitter</a>, conectar profissionalmente comigo no <a href=https://www.linkedin.com/in/jos%C3%A9-diogo-ribeiro-4390a86b/>LinkedIn</a> ou assistir à minha ira enquanto jogo PUBG live no <a href=https://www.twitch.tv/shinobarbaro>Twitch!</a>!"
